[package]
name = "albaro-notes"
version = "0.6.0"
description = "AlbaRo Notes: notas con editor de bloques, bases de datos e IA opcional"
authors = ["AlbaRoDev"]
edition = "2021"
license = "MIT"
# Not a crate to publish.
publish = false

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "albaro_notes_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[lints.rust]
# On Windows the linker prints "Creating library …" for the DLL's import library and rustc turns
# it into a warning that would fail a `-D warnings` build for nothing.
linker_messages = "allow"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["protocol-asset"] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.40", features = ["bundled"] }
uuid = { version = "1", features = ["v4"] }
tauri-plugin-dialog = "2"
ureq = "3"
url = "2"

# The credential store for the AI service's API key (src/secret.rs). Only where a backend exists
# and has been tried; elsewhere the key stays in a private file.
# The app's own updates (src/app_update.rs). Used from Rust only: no capability gives the page
# `updater:*`. Without its `zip` feature the plugin installs the .exe of Windows and an uncompressed
# AppImage on Linux, and is not built with `zip` 4.x, which has three RUSTSEC advisories in its
# extraction (symlinks, SUID). Updates as .zip or .tar.gz (macOS) wait for a plugin with `zip` >= 9.
[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri-plugin-updater = { version = "2.14.0", default-features = false, features = ["rustls-tls"] }

[target.'cfg(windows)'.dependencies]
keyring = { version = "3", features = ["windows-native"] }
# The same versions Tauri uses, to reach WebView2's settings (src/webview_privacy.rs).
webview2-com = "0.39"
windows-core = "0.62"

[target.'cfg(target_os = "macos")'.dependencies]
keyring = { version = "3", features = ["apple-native"] }


[dev-dependencies]
# Already in the tree through the updater: they read the public key in tauri.conf.json.
base64 = "0.22"
minisign-verify = "0.3"

# Read the optimization guideline for more details: https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
