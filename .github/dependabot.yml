# Weekly update pull requests for the three things that get dependencies: the CI actions (pinned by
# hash, so they only move through here), the Rust crates and the npm packages.
#
# The Tauri crates (`tauri`, `tauri-build`, the plugins) and the JS packages `@tauri-apps/*` have to
# stay aligned: when both groups open a pull request, merge them together and check the versions.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]

  - package-ecosystem: cargo
    directory: /src-tauri
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      tauri:
        patterns: ["tauri", "tauri-*", "wry", "tao", "webview2-com", "windows-core"]

  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      tauri:
        patterns: ["@tauri-apps/*"]
      tiptap:
        patterns: ["@tiptap/*"]
