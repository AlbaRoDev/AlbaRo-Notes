name: Release

# Pushing a tag `vX.Y.Z` builds the Windows installer, signs it for the app's updater and leaves a
# DRAFT release with the installer, `latest.json` and the SHA-256 hash. Nothing is public until
# someone reads the draft and presses "Publish": only then does the updater (releases/latest/download/
# latest.json) see it. What is checked: the version files match the tag, the licence notices are up to date, and the signing key exists only in one step.
#
# Before tagging: the version in package.json, tauri.conf.json and Cargo.toml equal to the tag, the
# licence notices up to date (`npm run notices`), CI green on the commit.
#
# Windows installer and Android APK (arm64, signed with its own key, no updater: the next APK is installed
# over it). Linux and macOS are not built: nothing has been tried there.
on:
  push:
    tags: ["v[0-9]+.[0-9]+.[0-9]+"]

permissions:
  contents: read

env:
  # The same Rust as ci.yml; bump both on purpose.
  RUST_VERSION: "1.98.1"

jobs:
  # Builds and signs. Its token can only read, and the signing key exists in a single step, after the
  # build: nothing that runs during `npm ci` or `tauri build` can see it.
  build:
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: The versions match the tag
        shell: bash
        run: |
          want="${GITHUB_REF_NAME#v}"
          for got in \
            "$(node -p "require('./package.json').version")" \
            "$(node -p "require('./src-tauri/tauri.conf.json').version")" \
            "$(grep -m1 '^version' src-tauri/Cargo.toml | cut -d'"' -f2)"; do
            [ "$got" = "$want" ] || { echo "tag $GITHUB_REF_NAME, but a version file says $got"; exit 1; }
          done
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master (= v1)
        with:
          toolchain: ${{ env.RUST_VERSION }}
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: src-tauri
      - name: The licence notices match the dependencies
        run: npm run notices:check
      - run: npm run tauri build -- --bundles nsis
      # GitHub turns spaces in asset names into dots, so the name is fixed here, before it goes into
      # latest.json. The file is signed with the updater key and the version (`requireSignedVersion`).
      - name: Collect and sign the installer
        shell: bash
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          [ -n "$TAURI_SIGNING_PRIVATE_KEY" ] || { echo "the secret TAURI_SIGNING_PRIVATE_KEY is not set"; exit 1; }
          mkdir release
          for f in src-tauri/target/release/bundle/nsis/*.exe; do
            [ -f "$f" ] || continue
            n=$(basename "$f")
            n=${n// /-}
            n=${n/_x64-setup.exe/_windows-x64-setup.exe}
            cp "$f" "release/$n"
          done
          [ -n "$(ls release)" ] || { echo "no installer was built"; exit 1; }
          for f in release/*.exe; do
            npm run tauri -- signer sign --app-version "${GITHUB_REF_NAME#v}" "$f"
          done
          ls -l release
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release
          path: release/
          if-no-files-found: error
          retention-days: 7

  # The APK is built unsigned (nothing during `npm ci` or Gradle sees the key) and signed in one step
  # afterwards, like the installer. Android needs the same key for every version: an APK signed with
  # another one cannot be installed over the previous one, and the key cannot be replaced.
  android:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: The versions match the tag
        run: |
          want="${GITHUB_REF_NAME#v}"
          for got in \
            "$(node -p "require('./package.json').version")" \
            "$(node -p "require('./src-tauri/tauri.conf.json').version")" \
            "$(grep -m1 '^version' src-tauri/Cargo.toml | cut -d'"' -f2)"; do
            [ "$got" = "$want" ] || { echo "tag $GITHUB_REF_NAME, but a version file says $got"; exit 1; }
          done
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master (= v1)
        with:
          toolchain: ${{ env.RUST_VERSION }}
          targets: aarch64-linux-android
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: src-tauri
      # The runner image has the SDK and a JDK; the NDK is the one the app is built and tried with.
      - name: Android toolchain
        run: |
          echo "JAVA_HOME=$JAVA_HOME_21_X64" >> "$GITHUB_ENV"
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "ndk;27.2.12479018"
          echo "NDK_HOME=$ANDROID_HOME/ndk/27.2.12479018" >> "$GITHUB_ENV"
      - run: npm run tauri android build -- --apk --target aarch64 --ci
      - name: Collect and sign the APK
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          [ -n "$ANDROID_KEYSTORE_BASE64" ] || { echo "the secret ANDROID_KEYSTORE_BASE64 is not set"; exit 1; }
          unsigned=$(ls src-tauri/gen/android/app/build/outputs/apk/universal/release/*-unsigned.apk)
          tools=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          # 16 kB pages (Android 15+): the library inside must be aligned for them.
          "$tools/zipalign" -c -P 16 4 "$unsigned"
          mkdir release
          out="release/AlbaRo-Notes_${GITHUB_REF_NAME#v}_android-arm64.apk"
          echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
          "$tools/apksigner" sign --ks "$RUNNER_TEMP/release.jks" --ks-key-alias "$ANDROID_KEY_ALIAS" \
            --ks-pass env:ANDROID_KEYSTORE_PASSWORD --key-pass env:ANDROID_KEY_PASSWORD \
            --out "$out" "$unsigned"
          rm -f "$RUNNER_TEMP/release.jks"
          "$tools/apksigner" verify --print-certs "$out"
          ls -l release
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-android
          path: release/
          if-no-files-found: error
          retention-days: 7

  # Writes to the repository (the draft release), but never sees the signing keys.
  draft:
    needs: [build, android]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: release*
          merge-multiple: true
          path: release
      - run: node scripts/release-manifest.mjs release "$GITHUB_REF_NAME" "$GITHUB_REPOSITORY"
      - name: Create the draft release
        run: |
          gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --verify-tag --draft \
            --title "AlbaRo Notes $GITHUB_REF_NAME" --notes-file release/RELEASE_NOTES.md \
            release/*.exe release/*.exe.sig release/*.apk release/latest.json release/SHA256SUMS
